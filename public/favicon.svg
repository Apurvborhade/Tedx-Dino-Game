  <line x1="16" y1="20" x2="16" y2="28" stroke="#f7f7f7" stroke-width="1.5"/>
  <line x1="4" y1="16" x2="12" y2="16" stroke="#f7f7f7" stroke-width="1.5"/>
  <line x1="20" y1="16" x2="28" y2="16" stroke="#f7f7f7" stroke-width="1.5"/>
  <line x1="7.5" y1="7.5" x2="13" y2="13" stroke="#f7f7f7" stroke-width="1.5"/>
  <line x1="19" y1="19" x2="24.5" y2="24.5" stroke="#f7f7f7" stroke-width="1.5"/>
  <line x1="24.5" y1="7.5" x2="19" y2="13" stroke="#f7f7f7" stroke-width="1.5"/>
  <line x1="13" y1="19" x2="7.5" y2="24.5" stroke="#f7f7f7" stroke-width="1.5"/>
</svg>